[package]
name = "voice_decoder"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
# AAC-LC and ISO/MP4 are opt-in, not Symphonia default features.
symphonia = { version = "=0.6.1", default-features = false, features = ["aac", "isomp4"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
