appId: com.monyvi.app
---
# #347 Voice R1/T062 + R2/T069 - honest UI visibility, examples dismissal and
# Manual fallback checks. AUTHORED, NOT RUN. Requires authenticated seeded E2E
# account. No fixture here can force an authenticated server daily/burst
# refusal, an OS permission change, or native audio capture.
# Conditional branches assert only states actually returned by the server;
# they MUST NOT be reported as evidence for a daily-limit/burst quota race.
# Dismissal is per-account and durable on this device, so the examples branch
# runs only while the card is actually visible.
- runFlow: ../helpers/setup.yaml
- tapOn:
    id: "fab-button"
- tapOn:
    id: "fab-transaction"
- tapOn:
    id: "add-transaction-mode-voice"
- waitForAnimationToEnd
- assertVisible:
    id: "add-transaction-mode-voice"

# Available: EN approved idle composition, progress based on live authoritative
# values (not hard-coded 3/5, no local quota arithmetic).
- runFlow:
    when:
      visible: "Limited free voice usage"
    commands:
      - assertVisible: "Tap and speak your transaction"
      - assertVisible: "Your limits reset tomorrow."
      - assertVisible:
          id: "voice-mic-target"
      # Entering Voice mode must never auto-start capture: no Starting, no
      # recording controls, no elapsed timer.
      - assertNotVisible: "Starting…"
      - assertNotVisible:
          id: "voice-action-stop"
      # Screenshot is owner visual evidence, NOT an automated pixel pass:
      # verify clipped 104dp gradient, NO ordinary filled 140/172dp halos,
      # and selected 2dp underline against accepted R2/frozen idle.
      - takeScreenshot: voice-idle-gradient-halos-tab-underline

# Examples card + per-account durable dismissal (FR-038). Conditional only: a
# previously dismissed account hides the card permanently on this device, and
# this flow MUST NOT un-hide it. Cold app restart, sign-out/sign-in and
# cross-account isolation remain manual-only.
- runFlow:
    when:
      visible: "Try saying something like"
    commands:
      - assertVisible:
          id: "voice-examples-card"
      # EN glyph identities stay restaurant orange / car blue / coffee gold;
      # Arabic stays quote-only. Static screenshots cannot prove colors.
      - takeScreenshot: voice-examples-card-before-dismiss
      - tapOn:
          id: "voice-examples-dismiss"
      # Whole card disappears immediately; the mic target is unaffected.
      - assertNotVisible:
          id: "voice-examples-card"
      - assertNotVisible: "Try saying something like"
      - assertVisible:
          id: "voice-mic-target"
      # In-route remount keeps the card hidden for this account/device.
      - tapOn:
          id: "add-transaction-mode-manual"
      - tapOn:
          id: "add-transaction-mode-voice"
      - waitForAnimationToEnd
      - assertNotVisible:
          id: "voice-examples-card"
      - assertNotVisible: "Try saying something like"
      - assertVisible:
          id: "voice-mic-target"
      # Real route exit and re-open (not a tab toggle): leaving to
      # Transactions and re-entering through FAB -> transaction -> Voice must
      # keep the card hidden. No mic/retry/permission tap happens here.
      - tapOn:
          id: "header-back"
      - waitForAnimationToEnd
      - assertVisible: "Transactions"
      - tapOn:
          id: "fab-button"
      - tapOn:
          id: "fab-transaction"
      - waitForAnimationToEnd
      - tapOn:
          id: "add-transaction-mode-voice"
      - waitForAnimationToEnd
      - assertNotVisible:
          id: "voice-examples-card"
      - assertNotVisible: "Try saying something like"
      - assertVisible:
          id: "voice-mic-target"

# Exhausted: conditional only; deterministic exhaustion requires seeded server
# state or an approved authenticated HTTP double, neither present here.
- runFlow:
    when:
      visible: "Daily voice limit reached"
    commands:
      - assertVisible: "Voice recording unavailable"
      - assertVisible: "Use manual entry"
      - assertNotVisible: "Try saying something like"
      # Verify native disabled circular mic/gray halos and selected underline
      # against the EN/AR daily bindings; this does not force server exhaustion.
      - takeScreenshot: voice-daily-limit-disabled-mic-tab-underline

# Availability check failure != exhaustion.
- runFlow:
    when:
      visible: "Voice unavailable"
    commands:
      - assertVisible: "Try again"
      - assertVisible: "Use Manual"
      - assertNotVisible: "Daily voice limit reached"

# Manual is usable regardless of actual quota/error/availability.
- tapOn:
    id: "add-transaction-mode-manual"
- assertVisible:
    id: "header-save"
- assertNotVisible: "Limited free voice usage"
- assertNotVisible: "Daily voice limit reached"
- assertNotVisible: "Voice unavailable"
- tapOn:
    id: "manual-amount-input"
- tapOn:
    id: "calculator-key-2"
- tapOn:
    id: "calculator-key-5"
- tapOn:
    id: "calculator-key-done"
- assertVisible: "25"
- tapOn:
    id: "header-save"
- waitForAnimationToEnd
- assertVisible: "Transactions"
# If the examples card was already dismissed for this seeded account, the
# dismiss/reopen scenario above was skipped and was NOT validated in this run
# (this flow never un-hides the card). The Manual save below ends on
# Transactions, where the card is always absent by construction, so no
# assertion is made there.

# MANUAL ONLY / NOT RUN: daily/burst 5th/6th and 2nd/3rd starts, reservation
# races, provider start consumption, local midnight reset, 35-day retention,
# #384 deferral, dark mode slate-700 allowance badge, Arabic quote-only
# examples and AR reset copy, EN/AR glyph color proof, 320/390/768/orientation
# and font-scale 1.35/2 layouts, reduced motion, screen-reader semantics and
# cold app restart persistence.

# R2 T069: idle/Starting omit ordinary 140/172dp filled backgrounds,
# while exhausted/unavailable keep the disabled artwork. Screenshot taking
# is NOT an automated visual-fidelity pass or proof of production timing.
# The three R2 recorded/paused/completed control states and explicit Submit
# require native audio/OS/provider fixtures this harness does not possess.
# Never tap mic, Resume, Submit, OS permission or provider recovery here;
# separately approved unit/owner-manual testing covers those boundaries.

