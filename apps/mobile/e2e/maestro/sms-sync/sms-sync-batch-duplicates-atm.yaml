appId: com.monyvi.app
---
# Batch SMS sync imports the configured E2E SMS inbox, opens the review page,
# saves the selected suggestions, and lets the runner verify saved
# fingerprint/dedup invariants in WatermelonDB.

- runFlow: ../helpers/open-settings.yaml

- scrollUntilVisible:
    element: "Sync New SMS"
    direction: DOWN
    centerElement: true

- tapOn: "Sync New SMS"

- extendedWaitUntil:
    visible: "Scan Complete!"
    timeout: 90000

- assertVisible: "Transactions Found"
- assertVisible: "Review [0-9]+ Transaction\\(s\\)"

- tapOn: "Review [0-9]+ Transaction\\(s\\)"

- extendedWaitUntil:
    visible:
      id: transaction-review-screen
    timeout: 30000

- extendedWaitUntil:
    visible:
      id: transaction-account-match
    timeout: 30000

- assertVisible: "[0-9]+ auto-selected"
- assertVisible: "[0-9]+ need review"

- tapOn: "Review [0-9]+ item(s)?"

- assertVisible: "Select shown"
- tapOn: "Select shown"

- assertVisible: "Save [0-9]+ selected"
- assertNotVisible: "Missing Info"

- tapOn: "Save [0-9]+ selected"

- extendedWaitUntil:
    visible: "Transactions"
    timeout: 30000
