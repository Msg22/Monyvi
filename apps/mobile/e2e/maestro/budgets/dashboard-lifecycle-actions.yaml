appId: com.monyvi.app
---
- runFlow: ../helpers/setup.yaml
- openLink: monyvi://budgets
- scrollUntilVisible:
    element: "E2E Paused Shopping"
    direction: DOWN
    timeout: 120000
- extendedWaitUntil:
    visible: "E2E Paused Shopping"
    timeout: 120000
- tapOn:
    id: ".*budget-action-resume-.*"
- assertVisible: "Resume budget?"
- tapOn:
    id: "modal-cancel"
- assertVisible: "E2E Paused Shopping"
- tapOn:
    id: ".*budget-action-resume-.*"
- tapOn:
    id: "modal-confirm"
- extendedWaitUntil:
    notVisible: "Resume budget?"
    timeout: 30000
- extendedWaitUntil:
    notVisible:
      id: ".*budget-action-resume-.*"
    timeout: 30000
- scrollUntilVisible:
    element: "E2E Expired Custom"
    direction: DOWN
    timeout: 30000
- tapOn:
    id: ".*budget-action-renew-.*"
- extendedWaitUntil:
    visible:
      id: "create-budget-screen"
    timeout: 120000
- assertVisible: "E2E Expired Custom"
