appId: com.monyvi.app
---
- runFlow: ../helpers/setup.yaml
- openLink: monyvi://budgets
- extendedWaitUntil:
    visible:
      id: "budgets-screen"
    timeout: 120000
- assertVisible: "Overall budgets"
- assertVisible: "E2E Monthly Overall"
- swipe:
    start: 90%, 45%
    end: 10%, 45%
    duration: 500
- extendedWaitUntil:
    visible: "E2E Weekly Overall"
    timeout: 30000
- tapOn:
    id: "budget-filter-weekly"
- assertVisible: "E2E Weekly Overall"
- assertNotVisible: "E2E Monthly Overall"
- tapOn:
    id: "budget-filter-monthly"
- assertVisible: "E2E Monthly Overall"
- assertNotVisible: "E2E Weekly Overall"
- tapOn:
    id: "budget-filter-custom"
- extendedWaitUntil:
    visible: "No budgets match this filter"
    timeout: 30000
- tapOn:
    id: "budget-filter-all"
- assertVisible: "E2E Monthly Overall"
- swipe:
    start: 90%, 45%
    end: 10%, 45%
    duration: 500
- extendedWaitUntil:
    visible: "E2E Weekly Overall"
    timeout: 30000
