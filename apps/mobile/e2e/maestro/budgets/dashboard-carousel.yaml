appId: com.monyvi.app
---
- runFlow: ../helpers/setup.yaml
- openLink: monyvi://budgets
- extendedWaitUntil:
    visible:
      id: "global-budget-carousel"
    timeout: 120000
- assertVisible: "E2E Monthly Overall"
- swipe:
    start: 90%, 45%
    end: 10%, 45%
    duration: 500
- extendedWaitUntil:
    visible: "E2E Weekly Overall"
    timeout: 30000
- assertVisible:
    id: "global-budget-page-dot-1"
