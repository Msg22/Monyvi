appId: com.monyvi.app
---
- runFlow: ../helpers/setup.yaml
- openLink: monyvi://budgets
- extendedWaitUntil:
    visible:
      id: "budgets-screen"
    timeout: 120000
- tapOn:
    id: "budget-filter-period"
- tapOn:
    id: "budget-filter-option-period-custom"
- extendedWaitUntil:
    visible: "No budgets match this filter"
    timeout: 30000
- tapOn: "Reset filters"
- assertVisible: "E2E Monthly Overall"
