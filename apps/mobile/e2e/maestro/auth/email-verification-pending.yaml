appId: com.monyvi.app
---
# #321 local verification code flow: fresh signup and returning unverified
# sign-in both land on the same code-entry state.

- waitForAnimationToEnd

- runFlow:
    when:
      visible: "This is the developer menu"
    commands:
      - tapOn: "Continue"
      - waitForAnimationToEnd

- runFlow:
    when:
      visible: "Connected to:"
    commands:
      - pressKey: Back
      - waitForAnimationToEnd

- extendedWaitUntil:
    visible: "Skip|Your money, understood."
    timeout: 120000

- runFlow:
    when:
      visible: "Skip"
    commands:
      - tapOn: "Skip"

- extendedWaitUntil:
    visible:
      id: "auth-email-input"
    timeout: 120000

- tapOn:
    id: "auth-mode-sign-up"
- tapOn:
    id: "auth-email-input"
- inputText: ${MAESTRO_E2E_VERIFICATION_EMAIL}
- hideKeyboard
- tapOn:
    id: "auth-password-input"
- inputText: ${MAESTRO_E2E_VERIFICATION_PASSWORD}
- hideKeyboard
- tapOn:
    id: "auth-submit-button"

- extendedWaitUntil:
    visible: "Verify your email"
    timeout: 30000
- assertVisible:
    id: "verification-email-chip"
- assertVisible:
    id: "verification-code-input"
- assertVisible: "Back to sign in"
- takeScreenshot: issue321-verification-code-en-light

# Returning unverified users must land on the same code-entry state without
# automatically consuming another resend.
- tapOn: "Back to sign in"
- extendedWaitUntil:
    visible:
      id: "auth-email-input"
    timeout: 30000
- tapOn:
    id: "auth-mode-sign-in"
- tapOn:
    id: "auth-email-input"
- eraseText
- inputText: ${MAESTRO_E2E_VERIFICATION_EMAIL}
- hideKeyboard
- tapOn:
    id: "auth-password-input"
- eraseText
- inputText: ${MAESTRO_E2E_VERIFICATION_PASSWORD}
- hideKeyboard
- tapOn:
    id: "auth-submit-button"

- extendedWaitUntil:
    visible: "Verify your email"
    timeout: 30000
- assertVisible:
    id: "verification-code-input"
- assertVisible:
    id: "verification-email-chip"
