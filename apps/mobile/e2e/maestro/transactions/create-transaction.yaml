appId: com.monyvi.app

---

# T031: Create and reopen a persisted expense transaction.
# Precondition: deterministic E2E seed with E2E Cash as the default account.

# Step 1: Navigate to Transactions.
- runFlow: ../helpers/setup.yaml

# Step 2: Open the quick-action FAB.
- tapOn:
    id: "fab-button"

- waitForAnimationToEnd

# Step 3: Open Add Transaction.
- tapOn:
    id: "fab-transaction"

- waitForAnimationToEnd

# Step 4: Verify the existing Manual transaction surface loaded.
- assertVisible: "New Transaction"
- assertVisible: "EXPENSE"

# The E2E seed makes E2E Cash the default account and the first top-level
# expense category is Food & Drinks.
- assertVisible: "E2E Cash"
- assertVisible: "Food & Drinks"

# Step 5: Enter 150 using the existing calculator keypad.
- tapOn: "1"
- tapOn: "5"
- tapOn: "0"

- assertVisible: "150"

# Preserve the existing EXPENSE interaction from this journey.
- tapOn:
    id: "type-tab-EXPENSE"

# Step 6: Save.
- tapOn:
    id: "header-save"

- waitForAnimationToEnd

# Step 7: Verify navigation returned to Transactions.
- assertVisible: "Transactions"

# Step 8: Filter by the unique created amount so assertions and the subsequent
# card tap target the transaction created by this journey rather than a seeded
# row with the same date.
- tapOn:
    id: "search-input"

- inputText: "150"
- pressKey: Back

- extendedWaitUntil:
    visible: "-150 EGP"
    timeout: 30000

# Verify persisted list presentation: category, account, and amount.
- assertVisible: "Food & Drinks"
- assertVisible: "E2E Cash"
- assertVisible: "-150 EGP"

# Step 9: Reopen the persisted transaction through the real current card
# selector. The 150 filter leaves the newly-created transaction as the match.
- tapOn:
    id: "transaction-card-.*"
    index: 0

- waitForAnimationToEnd

# Step 10: Verify persisted values on the real Edit Transaction screen.
- assertVisible: "Edit Transaction"
- assertVisible: "150"
- assertVisible: "E2E Cash"
- assertVisible: "Food & Drinks"
