appId: com.monyvi.app

---

# T032: Edit an existing transaction
# Precondition: At least one transaction exists

# Step 1: Launch app and navigate to Transactions
- runFlow: ../helpers/setup.yaml

# Step 2: Wait for transaction list to load
- waitForAnimationToEnd

# Step 3: Tap on the first transaction card
- tapOn:
    id: "transaction-card-.*"
    index: 0

- waitForAnimationToEnd

# Step 4: Verify edit screen opens
- assertVisible: "Edit Transaction"

# Step 5: Collapse seeded optional details when needed, then edit via stable keypad IDs
- runFlow:
    when:
      visible: "Hide Details"
    commands:
      - tapOn: "Hide Details"
- extendedWaitUntil:
    visible:
      id: "calculator-key-7"
    timeout: 30000
- tapOn:
    id: "calculator-key-7"
- tapOn:
    id: "calculator-key-7"
- tapOn:
    id: "calculator-key-7"

# Step 6: Tap Save
- tapOn:
    id: "header-save"

- waitForAnimationToEnd

# Step 7: Verify we're back on the transactions list
- assertVisible: "Transactions"
