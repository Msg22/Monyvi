name: Verify Issue 124

on:
  push:
    branches:
      - codex/124-stats-currency-filter

permissions:
  contents: read

jobs:
  verify:
    name: Stats Currency Filter Verification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SENTRYCLI_SKIP_DOWNLOAD: "1"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci
        timeout-minutes: 30

      - name: Typecheck mobile
        working-directory: apps/mobile
        run: npx tsc --noEmit

      - name: Lint mobile
        run: npm run lint -w @monyvi/mobile

      - name: i18n coverage
        working-directory: apps/mobile
        run: npm run i18n:check

      - name: Run issue 124 focused tests
        run: >-
          npm test -w @monyvi/mobile -- --runInBand
          apps/mobile/__tests__/services/stats-currency-filter.test.ts
          apps/mobile/__tests__/hooks/useStatsCurrencyFilter.test.ts
          apps/mobile/__tests__/components/stats/StatsCurrencyFilter.test.tsx
          apps/mobile/__tests__/app/stats-currency-filter.test.ts
