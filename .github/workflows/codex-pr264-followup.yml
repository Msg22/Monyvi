name: Codex PR 264 Follow-up

on:
  push:
    branches:
      - codex/103-recurring-payment-validation
    paths:
      - .github/codex/pr264-followup.py

permissions:
  contents: write

concurrency:
  group: codex-pr264-followup
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: codex/103-recurring-payment-validation

      - name: Apply prepared review changes
        shell: bash
        run: |
          set -euo pipefail
          script_file=".github/codex/pr264-followup.py"
          if [[ ! -f "$script_file" ]]; then
            echo "Follow-up script already consumed; nothing to do."
            exit 0
          fi

          python "$script_file"
          rm "$script_file"
          rm -f .github/codex/pr264-followup.patch

          git config user.name "OpenAI Codex"
          git config user.email "codex@openai.com"
          git add -A
          git commit -m "fix: address recurring review follow-up"
          git push origin HEAD:codex/103-recurring-payment-validation
