name: Codex Workspace Export

on:
  push:
    branches:
      - codex/103-recurring-payment-validation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    name: Export repository workspace
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Upload workspace
        uses: actions/upload-artifact@v4
        with:
          name: monyvi-workspace
          path: |
            .agent
            .github
            .specify
            apps
            docs
            packages
            scripts
            supabase
            package.json
            package-lock.json
            tsconfig.base.json
            nx.json
            eslint.config.*
            .nvmrc
            AGENTS.md
          include-hidden-files: true
          retention-days: 1
