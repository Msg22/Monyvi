name: Codex Apply Review Edits

on:
  push:
    branches:
      - codex/103-recurring-payment-validation
    paths:
      - .github/codex/review-edits.py

permissions:
  contents: write

concurrency:
  group: codex-apply-review-edits-103
  cancel-in-progress: false

jobs:
  apply:
    name: Apply prepared review edits
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: codex/103-recurring-payment-validation

      - name: Apply and commit edits
        shell: bash
        run: |
          set -euo pipefail
          edits_file=".github/codex/review-edits.py"
          if [[ ! -f "$edits_file" ]]; then
            echo "No prepared review edits; nothing to apply."
            exit 0
          fi

          python "$edits_file"
          rm "$edits_file"

          git config user.name "OpenAI Codex"
          git config user.email "codex@openai.com"
          git add -A
          git commit -m "fix: address PR review regressions"
          git push origin HEAD:codex/103-recurring-payment-validation
