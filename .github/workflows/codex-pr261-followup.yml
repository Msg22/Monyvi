name: Codex PR 261 Follow-up

on:
  push:
    branches:
      - codex/124-stats-currency-filter
    paths:
      - .github/codex/pr261-followup.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: codex/124-stats-currency-filter
      - name: Apply prepared review changes
        shell: bash
        run: |
          set -euo pipefail
          script_file=".github/codex/pr261-followup.py"
          if [[ ! -f "$script_file" ]]; then exit 0; fi
          python "$script_file"
          rm "$script_file"
          git config user.name "OpenAI Codex"
          git config user.email "codex@openai.com"
          git add -A
          git commit -m "fix(stats): address currency selector review feedback"
          git push origin HEAD:codex/124-stats-currency-filter
