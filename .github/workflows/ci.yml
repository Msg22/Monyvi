name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, codex/035-metals-module-redesign]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e-scope:
    name: Resolve Android E2E Scope
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.resolve.outputs.should_run }}
      matrix: ${{ steps.resolve.outputs.matrix }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve Android E2E scope
        id: resolve
        env:
          E2E_PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: node apps/mobile/scripts/resolve-ci-e2e-scope.js

  quality:
    name: Code Quality & Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Skip downloading the Sentry CLI binary — not needed for lint/typecheck/tests.
      # Without this, @sentry/cli's postinstall fetches a ~50MB binary from GitHub
      # Releases with no timeout, which silently hangs on flaky runners.
      SENTRYCLI_SKIP_DOWNLOAD: "1"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci
        timeout-minutes: 30

      - name: Typecheck
        working-directory: apps/mobile
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: QA SMS Privacy Check
        env:
          QA_SMS_PRIVACY_BASE_SHA:
            ${{ github.event.pull_request.base.sha || github.event.before }}
          QA_SMS_PRIVACY_HEAD_SHA:
            ${{ github.event.pull_request.head.sha || github.sha }}
        run: npm run qa-sms:privacy-check

      - name: i18n Coverage Check
        working-directory: apps/mobile
        run: npm run i18n:check

      - name: Test Logic Package
        run: npm test -w @monyvi/logic

      - name: Test Repository Scripts
        run: npm run test:scripts

      - name: Test QA SMS Privacy Check
        run: npm run test:qa-sms-privacy-check

      - name: Test QA SMS Import Command
        run: npm run test:qa-sms-import-command

      - name: Test QA SMS Ingest Command
        run: npm run test:qa-sms-ingest-command

      - name: Test QA SMS Promotion
        run: npm run test:qa-sms-promotion

      - name: Test Mobile App
        run: npm test -w @monyvi/mobile

  financial-action-pgtap:
    name: Financial Action pgTAP
    if: >-
      github.event_name == 'pull_request' && (github.event.pull_request.base.ref
      == 'main' || github.event.pull_request.base.ref ==
      'codex/035-metals-module-redesign')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SENTRYCLI_SKIP_DOWNLOAD: "1"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci
        timeout-minutes: 30

      - name: Start local Supabase
        run: npm run supabase:start:local
        timeout-minutes: 10

      - name: Run financial action pgTAP
        run:
          npx supabase test db --local
          supabase/tests/financial_action_canonicalization_test.sql
  android-build:
    name: Android Build Verification
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SENTRYCLI_SKIP_DOWNLOAD: "1"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # The dev client loads JavaScript from Metro, so only native inputs key this APK.
      - name: Cache Android debug APK
        id: apk-cache
        uses: actions/cache@v4
        with:
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          key:
            monyvi-debug-apk-v1-${{ runner.os }}-${{
            hashFiles('package-lock.json', 'apps/mobile/package.json',
            'apps/mobile/app.json', 'apps/mobile/plugins/**',
            'apps/mobile/assets/**', 'patches/**', 'apps/mobile/android/**') }}

      - name: Setup Node.js
        if: steps.apk-cache.outputs.cache-hit != 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Setup Java
        if: steps.apk-cache.outputs.cache-hit != 'true'
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Setup Gradle cache
        if: steps.apk-cache.outputs.cache-hit != 'true'
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Install dependencies
        if: steps.apk-cache.outputs.cache-hit != 'true'
        run: npm ci
        timeout-minutes: 10

      - name: Prebuild Expo Android
        if: steps.apk-cache.outputs.cache-hit != 'true'
        working-directory: apps/mobile
        run: npx expo prebuild --platform android

      - name: Configure Gradle memory
        if: steps.apk-cache.outputs.cache-hit != 'true'
        working-directory: apps/mobile/android
        run: |
          {
            echo ""
            echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8"
            echo "org.gradle.workers.max=2"
          } >> gradle.properties

      - name: Build Debug APK
        if: steps.apk-cache.outputs.cache-hit != 'true'
        working-directory: apps/mobile/android
        run:
          ./gradlew assembleDebug -PreactNativeArchitectures=x86_64 --no-daemon

  android-e2e:
    name: Android E2E Tests (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 180
    needs: [e2e-scope, quality, android-build]
    if:
      github.ref == 'refs/heads/main' && needs.e2e-scope.outputs.should_run ==
      'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.e2e-scope.outputs.matrix) }}
    env:
      CI: "true"
      EXPO_UNSTABLE_HEADLESS: "1"
      SENTRYCLI_SKIP_DOWNLOAD: "1"
      EXPO_PUBLIC_SENTRY_DSN: ""
      E2E_SUPABASE_MODE: local
      E2E_AUTH_DEEPLINK_BOOTSTRAP: "1"
      EXPO_PUBLIC_MONYVI_TEST_MODE: e2e
      EXPO_PUBLIC_AI_SMS_PARSER_MODE: fixture
      E2E_PREFLIGHT_ATTEMPT_TIMEOUT_MS: 600000
      E2E_LIVE_SMS_TIMEOUT_MS: 5400000
      E2E_CI_SUITES: ${{ matrix.suite }}
      E2E_DEVICE_OFFLINE_RETRY_COUNT: "1"
      E2E_SMS_SYNC_FLOW_ATTEMPT_COUNT: "1"
      ANDROID_SERIAL: emulator-5554
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Install dependencies
        run: npm ci
        timeout-minutes: 30

      - name: Start local Supabase
        run: npm run supabase:start:local
        timeout-minutes: 10

      - name: Prepare local E2E environment
        env:
          MATRIX_SUITE: ${{ matrix.suite }}
        run: |
          npx supabase status -o env | grep -E '^(ANON_KEY|SERVICE_ROLE_KEY)=' > supabase.env
          . ./supabase.env
          MAESTRO_E2E_EMAIL="e2e-${GITHUB_RUN_ID}-${MATRIX_SUITE}@monyvi.test"
          MAESTRO_E2E_PASSWORD="$(node -e "console.log(require('node:crypto').randomBytes(24).toString('base64url'))")"
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY="$ANON_KEY"
          SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY"
          export MAESTRO_E2E_EMAIL MAESTRO_E2E_PASSWORD EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY SUPABASE_SERVICE_ROLE_KEY
          node - <<'NODE' >> "$GITHUB_ENV"
          const { getE2eSeedConfig } = require("./apps/mobile/scripts/e2e-seed");
          const config = getE2eSeedConfig({
            E2E_SUPABASE_MODE: "local",
            EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: process.env.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY,
            SUPABASE_SERVICE_ROLE_KEY: process.env.SUPABASE_SERVICE_ROLE_KEY,
            MAESTRO_E2E_EMAIL: process.env.MAESTRO_E2E_EMAIL,
            MAESTRO_E2E_PASSWORD: process.env.MAESTRO_E2E_PASSWORD,
          });
          console.log(`EXPO_PUBLIC_SUPABASE_URL=${config.appSupabaseUrl}`);
          console.log(`EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${config.anonKey}`);
          console.log(`SUPABASE_SERVICE_ROLE_KEY=${config.serviceRoleKey}`);
          console.log(`MAESTRO_E2E_EMAIL=${config.email}`);
          console.log(`MAESTRO_E2E_PASSWORD=${config.password}`);
          NODE

      - name: Restore Android debug APK
        uses: actions/cache/restore@v4
        with:
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          key:
            monyvi-debug-apk-v1-${{ runner.os }}-${{
            hashFiles('package-lock.json', 'apps/mobile/package.json',
            'apps/mobile/app.json', 'apps/mobile/plugins/**',
            'apps/mobile/assets/**', 'patches/**', 'apps/mobile/android/**') }}
          fail-on-cache-miss: true

      - name: Install Maestro CLI
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Free Android E2E disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/.ghcup /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h

      - name: Cache Android emulator
        id: avd-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ runner.os }}-api35-google-apis-x86-64-pixel-7-v1

      - name: Create cached Android emulator
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disk-size: 4096M
          force-avd-creation: false
          emulator-options:
            -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
            -camera-back none
          disable-animations: false
          script: echo "Generated clean Android emulator snapshot."

      - name: Start Metro
        working-directory: apps/mobile
        run: |
          npx expo start --clear --dev-client --port 8081 > ../../metro.log 2>&1 &
          echo $! > ../../metro.pid

      - name: Run Maestro E2E on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disk-size: 4096M
          force-avd-creation: false
          emulator-options:
            -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio
            -no-boot-anim -camera-back none
          disable-animations: true
          script: bash apps/mobile/scripts/run-android-e2e-ci.sh

      - name: Stop Metro
        if: always()
        run: |
          if [ -f metro.pid ]; then
            kill "$(cat metro.pid)" || true
          fi

      - name: Upload E2E logs
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: android-e2e-logs-${{ matrix.suite }}
          path: |
            metro.log
            android-e2e-output.log
            android-e2e-failure-summary.log
            android-e2e-logcat.log
            ~/.maestro/tests
          retention-days: 7
