name: Codex Apply Review Patch

on:
  push:
    branches:
      - codex/103-recurring-payment-validation
    paths:
      - .github/codex/review.patch
      - .github/workflows/codex-apply-review-patch.yml

permissions:
  contents: write

concurrency:
  group: codex-apply-review-patch-103
  cancel-in-progress: false

jobs:
  apply:
    name: Apply prepared review patch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: codex/103-recurring-payment-validation

      - name: Apply and commit patch
        shell: bash
        run: |
          set -euo pipefail
          patch_file=".github/codex/review.patch"
          if [[ ! -f "$patch_file" ]]; then
            echo "No prepared review patch; nothing to apply."
            exit 0
          fi

          commit_message="$(sed -n '1s/^# commit-message: //p' "$patch_file")"
          if [[ -z "$commit_message" ]]; then
            echo "Missing '# commit-message: ...' header" >&2
            exit 1
          fi

          tail -n +2 "$patch_file" > /tmp/codex-review.patch
          printf '\n' >> /tmp/codex-review.patch
          git apply --check /tmp/codex-review.patch
          git apply /tmp/codex-review.patch
          rm "$patch_file"

          git config user.name "OpenAI Codex"
          git config user.email "codex@openai.com"
          git add -A
          git commit -m "$commit_message"
          git push origin HEAD:codex/103-recurring-payment-validation
