name: Codex 103 Review Follow-up Apply

on:
  push:
    branches:
      - codex/103-review-followup-2
    paths:
      - .github/codex/103-review-followup.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: codex/103-review-followup-2
      - name: Apply review follow-up implementation
        shell: bash
        run: |
          set -euo pipefail
          script_file=".github/codex/103-review-followup.py"
          if [[ ! -f "$script_file" ]]; then
            echo "No queued script; nothing to apply."
            exit 0
          fi
          python "$script_file"
          rm "$script_file"
          git config user.name "OpenAI Codex"
          git config user.email "codex@openai.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix: address recurring validation review follow-ups"
          git push origin HEAD:codex/103-review-followup-2
