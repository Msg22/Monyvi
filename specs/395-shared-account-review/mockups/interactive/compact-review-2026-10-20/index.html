&lt;script&gt;(() =&gt; {

      new CustomEvent(&quot;openai:set_globals&quot;, {

      }),

  };

    postToHost(&quot;height&quot;, {
      height: Math.ceil(
        Math.max(
          document.body.scrollHeight,
          document.body.getBoundingClientRect().height,
        ),
      ),
    });
  };

  globalThis.addEventListener(
    &quot;message&quot;,
    (event) =&gt; {
      const data = apply(getMessageData, event, []);
      const ports = apply(getMessagePorts, event, []);
      const source = apply(getMessageSource, event, []);
      if (
        hostPort != null ||
        source !== parentWindow ||
        typeof data !== &quot;object&quot; ||
        data?.type !== &quot;codex-visualization-initialize&quot; ||
        !isArray(ports) ||
        ports.length !== 1
      ) {
        return;
      }
      apply(stopMessagePropagation, event, []);
      const nextHostPort = ports[0];
      try {
        apply(addHostMessageListener, nextHostPort, [
          &quot;message&quot;,
          (event) =&gt; {
            const data = apply(getMessageData, event, []);
            if (typeof data === &quot;object&quot; &amp;&amp; data?.type === &quot;measure&quot;) {
              sendHeight();
            } else if (
              typeof data === &quot;object&quot; &amp;&amp;
              data?.type === &quot;widget-state-result&quot;
            ) {
              /** @type {unknown} */
              const id = data.id;
              if (typeof id !== &quot;number&quot;) {
                return;
              }
              const pending = pendingStateWrites.get(id);
              if (pending != null) {
                pendingStateWrites.delete(id);
                globalThis.clearTimeout(pending.timeout);
                if (data.ok === true) {
                  pending.resolve();
                } else {

                }
              }
            }
          },
        ]);
        apply(startHostPort, nextHostPort, []);
      } catch {
        return;
      }
      hostPort = nextHostPort;
      for (const [id, { serializedState }] of pendingStateWrites) {

      }
      sendHeight();
    },
    { capture: true },
  );
  document.currentScript?.remove();
  mediaQuery.addEventListener(&quot;change&quot;, syncTheme);
  globalThis.addEventListener(&quot;click&quot;, (event) =&gt; {
    if (event.defaultPrevented) {
      return;
    }
    let element = null;
    if (event.target instanceof globalThis.Element) {
      element = event.target;

    if (href == null) {
      return;
    }
    if (href.startsWith(&quot;#&quot;)) {

        id = decodeURIComponent(href.slice(1));

(function () {
  if (&quot;Tweak&quot; in window) return;
  let instance = 0;
  class PreviewTweak {
    constructor({container, onChange}) {
      this.onChange = onChange;
      this.controls = null;
      const stage = container.closest(&quot;.mv-stage&quot;);
      const parent = stage &amp;&amp; stage.parentElement;
      if (!parent) return;
      let group = parent.querySelector(&quot;:scope &gt; .mv-preview-controls&quot;);
      if (!group) {
        group = document.createElement(&quot;fieldset&quot;);
        group.className = &quot;mv-preview-controls&quot;;
        group.setAttribute(&quot;aria-label&quot;, &quot;Preview controls — not app UI&quot;);
        const legend = document.createElement(&quot;legend&quot;);
        legend.textContent = &quot;Preview controls&quot;;
        group.appendChild(legend);
        parent.insertBefore(group, stage);
      }
      this.controls = group;
      this.id = &quot;mv-preview-&quot; + (++instance) + &quot;-&quot;;
    }
    addSlider(state, key, options) {
      if (!this.controls) return;
      const field = document.createElement(&quot;div&quot;);
      field.className = &quot;mv-preview-control&quot;;
      const label = document.createElement(&quot;label&quot;);
      const id = this.id + key;
      label.htmlFor = id;
      label.dir = &quot;auto&quot;;
      const name = document.createElement(&quot;span&quot;);
      name.textContent = options.label;
      const value = document.createElement(&quot;output&quot;);
      value.htmlFor = id;
      const show = () =&gt; {
        value.textContent = key === &quot;scale&quot;
          ? Number(state[key]).toFixed(2) + &quot;×&quot;
          : String(state[key]) + (options.unit || &quot;&quot;);
      };
      label.append(name, value);
      const input = document.createElement(&quot;input&quot;);
      input.type = &quot;range&quot;;
      input.id = id;
      input.min = String(options.min);
      input.max = String(options.max);
      input.step = String(options.step);
      input.value = String(state[key]);
      input.addEventListener(&quot;input&quot;, () =&gt; {
        state[key] = Number(input.value);
        show();
        this.onChange();
      });
      show();
      field.append(label, input);
      this.controls.appendChild(field);
    }
    addToggle(state, key, options) {
      if (!this.controls) return;
      const field = document.createElement(&quot;div&quot;);
      field.className = &quot;mv-preview-control&quot;;
      const label = document.createElement(&quot;label&quot;);
      label.dir = &quot;auto&quot;;
      const id = this.id + key;
      label.htmlFor = id;
      const input = document.createElement(&quot;input&quot;);
      input.type = &quot;checkbox&quot;;
      input.id = id;
      input.checked = Boolean(state[key]);
      const name = document.createElement(&quot;span&quot;);
      name.textContent = options.label;
      const value = document.createElement(&quot;output&quot;);
      value.htmlFor = id;
      const show = () =&gt; { value.textContent = state[key] ? &quot;On&quot; : &quot;Off&quot;; };
      input.addEventListener(&quot;change&quot;, () =&gt; {
        state[key] = input.checked;
        show();
        this.onChange();
      });
      show();
      label.append(input, name, value);
      field.appendChild(label);
      this.controls.appendChild(field);
    }
  }
  window.Tweak = PreviewTweak;
})();

&lt;/style&gt;
&lt;script&gt;
(() =&gt; {
  const root = document.getElementById(&#x27;monyvi-review-concepts&#x27;);
  const transcript = &#x27;Paid 20 EGP from my TEST NEW QNB for coffee, paid 30 EGP from my TEST NEW QNB for tea, paid 40 EGP from my TEST NEW QNB for a book, paid 50 EGP from my TEST CIB for a game, paid 60 EGP for a snack, paid 70 at QNB, could be EGP or USD.&#x27;;
  const seed = [
    {id:&#x27;coffee&#x27;,name:&#x27;Coffee&#x27;,amount:20,category:&#x27;Food &amp; drinks&#x27;,group:&#x27;qnb&#x27;},
    {id:&#x27;tea&#x27;,name:&#x27;Tea&#x27;,amount:30,category:&#x27;Food &amp; drinks&#x27;,group:&#x27;qnb&#x27;},
    {id:&#x27;book&#x27;,name:&#x27;Book&#x27;,amount:40,category:&#x27;Shopping&#x27;,group:&#x27;qnb&#x27;},
    {id:&#x27;game&#x27;,name:&#x27;Game&#x27;,amount:50,category:&#x27;Shopping&#x27;,group:&#x27;cib&#x27;},
    {id:&#x27;snack&#x27;,name:&#x27;Snack&#x27;,amount:60,category:&#x27;Food &amp; drinks&#x27;,account:&#x27;Cash Wallet&#x27;,currency:&#x27;EGP&#x27;},
    {id:&#x27;unclear&#x27;,name:&#x27;Unclear currency purchase&#x27;,amount:70,category:&#x27;Shopping&#x27;,account:null,currency:null}
  ];
  const icon = name =&gt; `&lt;i data-lucide=&quot;${name===&#x27;pencil&#x27;?&#x27;square-pen&#x27;:name}&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;`;
  const safe = text =&gt; String(text).replace(/[&amp;&lt;&gt;&quot;&#x27;]/g, s =&gt; ({&#x27;&amp;&#x27;:&#x27;&amp;amp;&#x27;,&#x27;&lt;&#x27;:&#x27;&amp;lt;&#x27;,&#x27;&gt;&#x27;:&#x27;&amp;gt;&#x27;,&#x27;&quot;&#x27;:&#x27;&amp;quot;&#x27;,&quot;&#x27;&quot;:&#x27;&amp;#39;&#x27;}[s]));
  const previews = [];
  const saved = window.openai?.widgetState?.privateContent;
  root.querySelectorAll(&#x27;.mv-phone&#x27;).forEach(phone =&gt; {
    const concept = phone.dataset.concept;
    const state = {expanded:false,tab:&#x27;transactions&#x27;,filter:&#x27;all&#x27;,transcript:false,menu:null,linked:null,sheet:null,message:null,why:false,selected:[],groups:{qnb:{name:&#x27;TEST NEW QNB&#x27;,currency:&#x27;EGP&#x27;,confirmed:false},cib:{name:&#x27;TEST CIB&#x27;,currency:&#x27;EGP&#x27;,confirmed:false}},transactions:seed.map(t=&gt;({...t})),width:360,scale:1,longNames:false};
    const manuallyDeselected = new Set();
    const removedSuggestions = new Map();
    if (saved?.[concept]) {
      const previous = saved[concept];
      [&#x27;expanded&#x27;,&#x27;tab&#x27;,&#x27;filter&#x27;,&#x27;transcript&#x27;,&#x27;width&#x27;,&#x27;scale&#x27;,&#x27;longNames&#x27;].forEach(key =&gt; { if (typeof previous[key] === typeof state[key]) state[key] = previous[key]; });
    }
    const currentGroupIds = () =&gt; [...new Set(state.transactions.map(t=&gt;t.group).filter(Boolean))];
    const displayedGroupIds = () =&gt; Object.keys(state.groups).filter(id=&gt;currentGroupIds().includes(id)||removedSuggestions.has(id));
    const pending = () =&gt; currentGroupIds().filter(id=&gt;!state.groups[id].confirmed).length;
    const needsAccount = t =&gt; !t.group &amp;&amp; !t.account;
    const needsReview = t =&gt; needsAccount(t) || (t.group &amp;&amp; !state.groups[t.group].confirmed) || !t.category?.trim() || !(t.amount&gt;0) || !(t.group?state.groups[t.group].currency:t.currency);
    function syncReadySelection() {
      state.selected=state.selected.filter(id=&gt;{const t=state.transactions.find(row=&gt;row.id===id);return t&amp;&amp;!needsReview(t)&amp;&amp;!manuallyDeselected.has(id);});
      state.transactions.forEach(t=&gt;{if(!needsReview(t)&amp;&amp;!manuallyDeselected.has(t.id)&amp;&amp;!state.selected.includes(t.id))state.selected.push(t.id);});
    }
    const displayName = group =&gt; state.longNames ? group.name + &#x27; Personal Savings Account&#x27; : group.name;
    const accountName = t =&gt; t.group ? displayName(state.groups[t.group]) : t.account;
    const currency = t =&gt; t.group ? state.groups[t.group].currency : t.currency;
    const groupTransactions = id =&gt; state.transactions.filter(t=&gt;t.group===id);
    const persist = () =&gt; {
      const privateContent = Object.fromEntries(previews.map(p=&gt;[p.concept,{expanded:p.state.expanded,tab:p.state.tab,filter:p.state.filter,transcript:p.state.transcript,width:p.state.width,scale:p.state.scale,longNames:p.state.longNames}]));
      window.openai?.setWidgetState?.({modelContent:{design:&#x27;ملخّص قابل للفتح&#x27;,readyAutoSelection:true},privateContent})?.catch(()=&gt;{});
    };
    function groupMarkup(id,contextual=false) {
      const group = state.groups[id];
      const linked = groupTransactions(id);
      const removed = removedSuggestions.get(id);
      if(removed) return `&lt;div class=&quot;mv-group mv-removed&quot; data-group=&quot;${id}&quot;&gt;&lt;div class=&quot;mv-group-head&quot;&gt;&lt;span class=&quot;mv-mark&quot;&gt;${icon(&#x27;landmark&#x27;)}&lt;/span&gt;&lt;div class=&quot;mv-group-copy&quot;&gt;&lt;div class=&quot;mv-group-name&quot;&gt;${safe(displayName(group))} · ${group.currency}&lt;/div&gt;&lt;div class=&quot;mv-group-sub&quot;&gt;&lt;span&gt;Suggestion removed&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;mv-group-actions&quot;&gt;&lt;button class=&quot;mv-small cursor-interaction&quot; data-action=&quot;undo-suggestion&quot; data-id=&quot;${id}&quot;&gt;${icon(&#x27;rotate-ccw&#x27;)}Undo&lt;/button&gt;&lt;button class=&quot;mv-icon mv-discard-suggestion cursor-interaction&quot; aria-label=&quot;Discard ${safe(group.name)} suggestion permanently&quot; data-tooltip=&quot;Discard suggestion permanently&quot; data-action=&quot;discard-suggestion&quot; data-id=&quot;${id}&quot;&gt;${icon(&#x27;trash-2&#x27;)}&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;`;
      return `&lt;div class=&quot;mv-group&quot; data-group=&quot;${id}&quot;&gt;&lt;div class=&quot;mv-group-head&quot;&gt;&lt;span class=&quot;mv-mark&quot;&gt;${icon(&#x27;landmark&#x27;)}&lt;/span&gt;&lt;div class=&quot;mv-group-copy&quot;&gt;&lt;div class=&quot;mv-group-name&quot;&gt;${safe(displayName(group))} &lt;span style=&quot;white-space:nowrap&quot;&gt;· ${group.currency}&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;mv-group-sub&quot;&gt;&lt;span class=&quot;${group.confirmed?&#x27;&#x27;:&#x27;mv-need&#x27;}&quot;&gt;${group.confirmed?&#x27;Confirmed&#x27;:&#x27;New account&#x27;}&lt;/span&gt;&lt;span&gt;${linked.length} ${linked.length===1?&#x27;transaction&#x27;:&#x27;transactions&#x27;}&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;mv-group-actions&quot;&gt;&lt;button class=&quot;mv-small cursor-interaction&quot; data-action=&quot;${group.confirmed?&#x27;change&#x27;:&#x27;confirm&#x27;}&quot; data-id=&quot;${id}&quot;&gt;${icon(group.confirmed?&#x27;pencil&#x27;:&#x27;circle-check&#x27;)}${group.confirmed?&#x27;Change&#x27;:&#x27;Confirm&#x27;}&lt;/button&gt;&lt;button class=&quot;mv-icon mv-more cursor-interaction&quot; aria-label=&quot;Actions for ${safe(group.name)}&quot; aria-expanded=&quot;${state.menu===id}&quot; data-action=&quot;menu&quot; data-id=&quot;${id}&quot;&gt;${icon(&#x27;ellipsis-vertical&#x27;)}&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;${contextual?&#x27;&#x27;:`&lt;button class=&quot;mv-link mv-linked cursor-interaction&quot; data-action=&quot;linked&quot; data-id=&quot;${id}&quot; aria-expanded=&quot;${state.linked===id}&quot;&gt;${state.linked===id?&#x27;Hide linked transactions&#x27;:&#x27;View linked transactions&#x27;} ${icon(state.linked===id?&#x27;chevron-up&#x27;:&#x27;chevron-down&#x27;)}&lt;/button&gt;`}${!contextual&amp;&amp;state.linked===id?`&lt;div class=&quot;mv-linked-list&quot;&gt;${linked.map(t=&gt;`&lt;div class=&quot;mv-linked-row&quot;&gt;&lt;span&gt;${safe(t.name)}&lt;/span&gt;&lt;span&gt;${t.amount} ${group.currency}&lt;/span&gt;&lt;/div&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;`:&#x27;&#x27;}${state.menu===id?`&lt;div class=&quot;mv-menu&quot;&gt;&lt;button class=&quot;cursor-interaction&quot; data-action=&quot;editgroup&quot; data-id=&quot;${id}&quot;&gt;Edit details&lt;/button&gt;&lt;button class=&quot;cursor-interaction&quot; data-action=&quot;change&quot; data-id=&quot;${id}&quot;&gt;Use existing account&lt;/button&gt;&lt;button class=&quot;cursor-interaction&quot; data-action=&quot;remove&quot; data-id=&quot;${id}&quot;&gt;Remove suggestion&lt;/button&gt;&lt;/div&gt;`:&#x27;&#x27;}&lt;/div&gt;`;
    }
    function transactionMarkup(t,contextual=false) {
      const unresolved = needsAccount(t);
      const name = accountName(t);
      return `&lt;article class=&quot;mv-transaction&quot;&gt;&lt;div class=&quot;mv-tx-top&quot;&gt;&lt;label class=&quot;mv-check&quot;&gt;&lt;input type=&quot;checkbox&quot; aria-label=&quot;Select ${safe(t.name)}&quot; data-select=&quot;${t.id}&quot; ${state.selected.includes(t.id)?&#x27;checked&#x27;:&#x27;&#x27;}&gt;&lt;/label&gt;&lt;div class=&quot;mv-tx-name&quot;&gt;${safe(t.name)}&lt;div class=&quot;mv-time&quot;&gt;Today · 12:00 PM&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;mv-amount&quot;&gt;−${t.amount} ${currency(t)||&#x27;&#x27;}&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;mv-tx-meta&quot;&gt;${contextual&amp;&amp;t.group?`&lt;button class=&quot;mv-link mv-category cursor-interaction&quot; aria-label=&quot;Choose account for ${safe(t.name)}&quot; data-action=&quot;choose&quot; data-id=&quot;${t.id}&quot;&gt;Change account ${icon(&#x27;pencil&#x27;)}&lt;/button&gt;`:`&lt;div class=&quot;mv-meta&quot;&gt;${icon(unresolved?&#x27;circle-help&#x27;:name===&#x27;Cash Wallet&#x27;?&#x27;banknote&#x27;:&#x27;landmark&#x27;)}&lt;span class=&quot;${unresolved?&#x27;mv-need&#x27;:&#x27;&#x27;}&quot;&gt;${safe(name||&#x27;Choose an account&#x27;)}&lt;/span&gt;&lt;button class=&quot;mv-edit cursor-interaction&quot; aria-label=&quot;Choose account for ${safe(t.name)}&quot; data-action=&quot;choose&quot; data-id=&quot;${t.id}&quot;&gt;${icon(&#x27;pencil&#x27;)}&lt;/button&gt;&lt;/div&gt;`}&lt;div class=&quot;mv-meta mv-category&quot;&gt;${icon(t.category===&#x27;Shopping&#x27;?&#x27;shopping-bag&#x27;:&#x27;utensils&#x27;)}&lt;span&gt;${safe(t.category)}&lt;/span&gt;&lt;button class=&quot;mv-edit cursor-interaction&quot; aria-label=&quot;Edit category for ${safe(t.name)}&quot; data-action=&quot;category&quot; data-id=&quot;${t.id}&quot;&gt;${icon(&#x27;pencil&#x27;)}&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;${!contextual&amp;&amp;t.group&amp;&amp;!state.groups[t.group].confirmed?&#x27;&lt;div class=&quot;mv-tag&quot;&gt;New account&lt;/div&gt;&#x27;:&#x27;&#x27;}&lt;/article&gt;`;
    }
    function sheetMarkup() {
      const sheet = state.sheet;
      if (!sheet) return &#x27;&#x27;;
      const tx = state.transactions.find(t=&gt;t.id===sheet.id);
      const group = state.groups[sheet.id];
      let title=&#x27;&#x27;,body=&#x27;&#x27;,footer=&#x27;&#x27;;
      if (sheet.kind===&#x27;choose&#x27;) {
        title=&#x27;Choose an account&#x27;;
        const affected = sheet.group ? groupTransactions(sheet.id) : [tx];
        body=`&lt;div class=&quot;mv-sheet-context&quot;&gt;${sheet.group?`Applies to all ${affected.length} linked transactions`:&#x27;For &#x27;+safe(tx.name)}&lt;div class=&quot;mv-linked-list&quot; style=&quot;margin:7px 0 0&quot;&gt;${affected.map(t=&gt;`${safe(t.name)} · ${t.amount}`).join(&#x27;&lt;br&gt;&#x27;)}&lt;/div&gt;&lt;/div&gt;${[{name:&#x27;QNB Savings Account&#x27;,currency:&#x27;EGP&#x27;},{name:&#x27;CIB Dollar Account&#x27;,currency:&#x27;USD&#x27;},{name:&#x27;Cash Wallet&#x27;,currency:&#x27;EGP&#x27;}].map((a,i)=&gt;`&lt;label class=&quot;mv-account-option&quot;&gt;${icon(a.name===&#x27;Cash Wallet&#x27;?&#x27;banknote&#x27;:&#x27;landmark&#x27;)}&lt;span&gt;${a.name}&lt;small&gt;${a.currency}&lt;/small&gt;&lt;/span&gt;&lt;input name=&quot;${concept}-account&quot; type=&quot;radio&quot; value=&quot;${i}&quot; ${sheet.choice===i?&#x27;checked&#x27;:&#x27;&#x27;}&gt;&lt;/label&gt;`).join(&#x27;&#x27;)}&lt;button class=&quot;mv-link cursor-interaction&quot; data-action=&quot;newaccount&quot;&gt;${icon(&#x27;plus&#x27;)}Prepare a new account&lt;/button&gt;&lt;p&gt;The selected account sets the currency. The numeric amount stays unchanged.&lt;/p&gt;`;
        footer=`&lt;button class=&quot;mv-button mv-save cursor-interaction&quot; data-action=&quot;applyaccount&quot; ${sheet.choice===undefined?&#x27;disabled&#x27;:&#x27;&#x27;}&gt;Use account${sheet.choice===undefined?&#x27;&#x27;:&#x27; — &#x27;+([&#x27;EGP&#x27;,&#x27;USD&#x27;,&#x27;EGP&#x27;][sheet.choice])}&lt;/button&gt;`;
      } else if (sheet.kind===&#x27;editgroup&#x27;||sheet.kind===&#x27;newaccount&#x27;) {
        title=sheet.kind===&#x27;editgroup&#x27;?&#x27;Edit suggested account&#x27;:&#x27;Prepare a new account&#x27;;
        body=`&lt;div class=&quot;mv-sheet-context&quot;&gt;${sheet.group?`${groupTransactions(sheet.id).length} linked transactions`:&#x27;For &#x27;+safe(tx?.name||&#x27;this transaction&#x27;)}&lt;/div&gt;&lt;label class=&quot;mv-field-label&quot;&gt;Account name&lt;input type=&quot;text&quot; data-field=&quot;name&quot; value=&quot;${safe(sheet.name||&#x27;&#x27;)}&quot; autocomplete=&quot;off&quot;&gt;&lt;/label&gt;&lt;label class=&quot;mv-field-label&quot;&gt;Account type&lt;select data-field=&quot;type&quot;&gt;&lt;option value=&quot;bank&quot; ${sheet.type===&#x27;bank&#x27;?&#x27;selected&#x27;:&#x27;&#x27;}&gt;Bank account&lt;/option&gt;&lt;option value=&quot;wallet&quot; ${sheet.type===&#x27;wallet&#x27;?&#x27;selected&#x27;:&#x27;&#x27;}&gt;Digital wallet&lt;/option&gt;&lt;option value=&quot;cash&quot; ${sheet.type===&#x27;cash&#x27;?&#x27;selected&#x27;:&#x27;&#x27;}&gt;Cash&lt;/option&gt;&lt;/select&gt;&lt;/label&gt;&lt;label class=&quot;mv-field-label&quot;&gt;Currency&lt;select data-field=&quot;currency&quot;&gt;&lt;option ${sheet.currency===&#x27;EGP&#x27;?&#x27;selected&#x27;:&#x27;&#x27;}&gt;EGP&lt;/option&gt;&lt;option ${sheet.currency===&#x27;USD&#x27;?&#x27;selected&#x27;:&#x27;&#x27;}&gt;USD&lt;/option&gt;&lt;/select&gt;&lt;/label&gt;&lt;p&gt;This is a draft. It is created only when you save its selected transactions.&lt;/p&gt;`;
        footer=&#x27;&lt;button class=&quot;mv-button mv-save cursor-interaction&quot; data-action=&quot;applydraft&quot;&gt;Confirm draft&lt;/button&gt;&#x27;;
