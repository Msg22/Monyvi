<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 430" role="img" aria-labelledby="title description">
  <title id="title">Monyvi financial flow illustration, right-to-left layout</title>
  <desc id="description">Voice, bank message, currency, and gold signals converge into one organized ledger. Layout is mirrored while icon glyphs retain their normal orientation.</desc>
  <style>
    :root {
      --flow: #6f9c92;
      --flow-muted: #aac2bc;
      --accent: #d99a13;
      --accent-soft: #f8d778;
      --surface: #ffffff;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --flow: #78afa1;
        --flow-muted: #4d746b;
        --accent: #fbbf24;
        --accent-soft: #8a6515;
        --surface: #1e293b;
      }
    }
    .flow {
      fill: none;
      stroke: var(--flow);
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 2.65;
    }
    .muted {
      fill: none;
      stroke: var(--flow-muted);
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 2.25;
    }
    .surface { fill: var(--surface); }
  </style>

  <!-- Mirror only layout geometry. Semantic glyphs below remain unflipped. -->
  <g transform="translate(360 0) scale(-1 1)">
    <g id="connections">
      <path class="muted" opacity=".62" d="M18 174C79 174 94 210 94 258v22c0 31 27 45 62 54" />
      <path class="flow" d="M270 55h-17c-39 0-59 19-59 58v143c0 43-17 62-38 78" />
      <path class="flow" d="M273 137h-15c-35 0-53 20-53 55v70c0 39-21 59-49 72" />
      <path class="flow" d="M272 220h-8c-34 0-48 19-48 49 0 35-26 54-60 65" />
      <path class="flow" d="M270 302c-30 0-41 13-62 22l-52 10" />
    </g>

    <g id="convergence">
      <circle cx="156" cy="334" r="5" fill="var(--flow)" />
      <path class="flow" d="M156 339v18" />
    </g>

    <g id="ledger-ring" transform="translate(96 355)">
      <circle cx="60" cy="37" r="37" class="surface" stroke="var(--flow)" stroke-width="2.4" />
    </g>
  </g>

  <g id="voice" transform="translate(27 27)">
    <path class="muted" d="M0 28v-7M7 32V16M14 35V13M21 31V17M28 27v-5" />
    <path class="flow" d="M53 12v11a7 7 0 0 1-14 0V12a7 7 0 0 1 14 0zM35 23a11 11 0 0 0 22 0M46 34v8M41 42h10" />
  </g>

  <g id="bank-message" transform="translate(24 112)">
    <path class="flow" d="M4 0h44a7 7 0 0 1 7 7v25a7 7 0 0 1-7 7H26L14 48v-9H7a7 7 0 0 1-7-7V7a7 7 0 0 1 7-7z" />
    <circle cx="17" cy="19.5" r="2.7" fill="var(--flow)" />
    <circle cx="28" cy="19.5" r="2.7" fill="var(--flow)" />
    <circle cx="39" cy="19.5" r="2.7" fill="var(--flow)" />
  </g>

  <g id="currency" transform="translate(18 196)">
    <path class="surface" d="M7 7h48a5 5 0 0 1 5 5v28a5 5 0 0 1-5 5H7a5 5 0 0 1-5-5V12a5 5 0 0 1 5-5z" stroke="var(--flow)" stroke-width="2.5" />
    <path class="flow" d="M10 15h5M47 15h5M10 37h5M47 37h5" />
    <circle cx="31" cy="26" r="9" class="surface" stroke="var(--flow)" stroke-width="2.4" />
    <path class="muted" d="M27 22h8M27 26h8M27 30h5" />
  </g>

  <g id="gold" transform="translate(30 280)">
    <circle cx="25" cy="25" r="22" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="2.4" />
    <circle cx="25" cy="25" r="16" fill="none" stroke="var(--accent)" stroke-width="1.7" opacity=".82" />
    <text x="25" y="30" text-anchor="middle" fill="var(--accent)" font-family="Georgia, serif" font-size="15" font-weight="700">Au</text>
  </g>

  <!-- Normal, unmirrored note and checkmark prevent a backwards RTL glyph. -->
  <g id="ledger-glyph" transform="translate(144 355)">
    <rect x="35" y="17" width="28" height="39" rx="3" class="surface" stroke="var(--flow)" stroke-width="2.4" />
    <path class="muted" d="M42 28h14M42 37h14M42 46h9" />
    <path class="flow" d="m70 55 7 7 12-16" />
  </g>
</svg>
