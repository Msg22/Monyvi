openapi: 3.1.0
info:
  title: Monyvi Voice AI Availability
  version: 1.0.0
paths:
  /functions/v1/voice-ai-availability:
    post:
      summary: Read the authenticated user's authoritative voice allowance state
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [timeZone]
              properties:
                timeZone:
                  type: string
                  minLength: 1
                  maxLength: 128
                  description: Valid IANA timezone from the user's device.
      responses:
        "200":
          description: Authoritative availability state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VoiceAvailability"
        "400":
          description: Missing or invalid timezone
        "401":
          description: Unauthenticated
        "403":
          description:
            AI processing consent required; no accounting/provider start
        "405":
          description:
            Unsupported method; OPTIONS serves CORS without accounting
        "503":
          description: Authoritative entitlement/accounting state unavailable
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    VoiceAvailability:
      type: object
      additionalProperties: false
      oneOf:
        - properties:
            dailyLimit: { type: integer, minimum: 1 }
            remaining: { type: integer, minimum: 0 }
            resetAt: { type: string, format: date-time }
        - properties:
            dailyLimit: { type: "null" }
            remaining: { type: "null" }
            resetAt: { type: "null" }
            reason: { enum: [burst_limit, null] }
      required:
        - serverNow
        - timeZone
        - dailyLimit
        - remaining
        - resetAt
        - reason
        - availableAt
        - burstAvailableAt
        - policyVersion
      properties:
        serverNow:
          type: string
          format: date-time
        timeZone:
          type: string
        dailyLimit:
          type: [integer, "null"]
          minimum: 1
        remaining:
          type: [integer, "null"]
          minimum: 0
        resetAt:
          type: [string, "null"]
          format: date-time
        reason:
          type:
            - string
            - "null"
          enum: [daily_limit, burst_limit, null]
        availableAt:
          type:
            - string
            - "null"
          format: date-time
        burstAvailableAt:
          type:
            - string
            - "null"
          format: date-time
        policyVersion:
          type: string
          minLength: 1
      description: >
        Canonical availability shape. Current free launch always emits numeric
        dailyLimit/remaining and a non-null resetAt. The existing technical
        unmetered representation reserves null for all three together, retains
        burst enforcement and policyVersion, and cannot report daily_limit. It
        is exercised through controlled entitlement doubles only; no unmetered
        configuration, paid plan or unlimited UI ships in this feature.
        remaining includes active reservations as held capacity, not consumed
        units. reason is a current daily/burst blocker; replay belongs to the
        enclosing parse refusal reason. Missing/invalid policy or accounting
        yields 503, never an unmetered or available success fallback.
