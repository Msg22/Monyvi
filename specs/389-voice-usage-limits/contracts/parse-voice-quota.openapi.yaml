openapi: 3.1.0
info:
  title: Monyvi parse-voice Quota Extension
  version: 1.0.0
  description: >
    Additive request/refusal metadata for feature 389. The successful financial
    transaction response remains unchanged.
paths:
  /functions/v1/parse-voice:
    post:
      summary: Parse one voice recording after authoritative entitlement admission
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [audio, requestKey, callerTimeZone, callerLocalDate]
              properties:
                audio:
                  type: string
                  format: binary
                requestKey:
                  type: string
                  minLength: 1
                  maxLength: 160
                callerTimeZone:
                  type: string
                  minLength: 1
                  maxLength: 128
                callerLocalDate:
                  type: string
                  pattern: "^\\d{4}-\\d{2}-\\d{2}$"
                categories:
                  type: string
                accounts:
                  type: string
                  description: Existing JSON-serialized account context.
      responses:
        "200":
          description: Existing successful parse-voice transaction response, unchanged
        "400":
          description: Malformed audio/request identity/timezone/date
        "401":
          description: Unauthenticated
        "403":
          description: AI processing consent required
        "429":
          description: Daily allowance exhausted, burst-limited, or replay already consumed
          content:
            application/json:
              schema:
                type: object
                required: [error, reason, availability]
                properties:
                  error:
                    type: string
                  reason:
                    type: string
                    enum: [daily_limit, burst_limit, already_processed_result_unavailable]
                  availability:
                    $ref: "voice-ai-availability.openapi.yaml#/components/schemas/VoiceAvailability"
        "503":
          description: Authoritative usage/entitlement state unavailable
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
